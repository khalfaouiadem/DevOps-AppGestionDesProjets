services:
  db:
    image: mysql:8.0
    container_name: projet-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projetdb
    volumes:
      - db-data:/var/lib/mysql          # volume persistant
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    container_name: projet-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/projetdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy      # démarre après la base
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: projet-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend                         # démarre après le backend
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
